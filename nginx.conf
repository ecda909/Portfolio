server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gatsby emits a real directory per route (/projects/index.html), so try the
    # path, then the directory, then fall back to Gatsby's own 404 page rather
    # than nginx-branded chrome.
    location / {
        try_files $uri $uri/ $uri/index.html /404.html;
    }

    # Content-hashed bundles are immutable; Gatsby renames them on change.
    location ~* \.(js|css|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML must never be cached, or a client keeps loading an old page that
    # references asset hashes which no longer exist after a deploy.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
